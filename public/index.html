
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>قيمة - Qaima</title>
<style>
body{font-family:system-ui;background:#0f0f0f;color:#fff;margin:0;padding:20px}
.card{background:#1a1a1a;border-radius:16px;padding:20px;margin-bottom:16px;border:1px solid #2a2a2a}
.btn{background:#fff;color:#000;border:0;padding:12px 20px;border-radius:12px;font-weight:700;cursor:pointer}
.btn:hover{opacity:.9}
input{background:#222;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;width:100%;margin:6px 0}
.badge{padding:4px 10px;border-radius:20px;font-size:12px}
.badge-ok{background:#22c55e;color:#000}
.badge-warn{background:#facc15;color:#000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
</style>
</head>
<body>
<h1>🍽️ قيمة - لوحة التحكم</h1>
<div class="card" id="status">جاري فحص قاعدة البيانات...</div>

<div class="card">
<h3>إضافة مطعم جديد</h3>
<input id="rName" placeholder="اسم المطعم مثلا: مطعم طرابلس">
<input id="rPrice" type="number" placeholder="سعر التوصيل 5" value="5">
<button class="btn" onclick="addRestaurant()">إنشاء وتفعيل ✅</button>
</div>

<div id="restaurants" class="grid"></div>

<h2>الطلبات</h2>
<div id="orders"></div>

<script>
async function checkHealth(){
  try{
    const r = await fetch('/api/health'); const j = await r.json();
    document.getElementById('status').innerHTML = j.hasKV ? 
      '<span class="badge badge-ok">✅ KV متصل - الحفظ الدائم مفعل - '+j.mode+'</span> قاعدة البيانات شغالة' :
      '<span class="badge badge-warn">⚠️ وضع مؤقت</span> أعد الـ Redeploy لتفعيل KV';
  }catch(e){ document.getElementById('status').textContent='خطأ اتصال'; }
}
async function loadRestaurants(){
  const r = await fetch('/api/restaurants'); const list = await r.json();
  document.getElementById('restaurants').innerHTML = list.map(x=>`
    <div class="card">
      <b>${x.name}</b><br>التوصيل: ${x.price} د.ل<br>
      <span class="badge badge-ok">${x.active?'مفعل':'موقف'}</span>
      <br><br><button class="btn" style="background:#333;color:#fff" onclick="delRest('${x.id}')">حذف</button>
    </div>`).join('') || 'لا يوجد مطاعم';
}
async function addRestaurant(){
  const name = document.getElementById('rName').value.trim();
  const price = document.getElementById('rPrice').value;
  if(!name) return alert('اكتب اسم المطعم');
  const r = await fetch('/api/restaurants',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,price})});
  const j = await r.json();
  document.getElementById('rName').value=''; loadRestaurants(); alert('تم إضافة '+j.name+' ✅ وسيبقى للأبد');
}
async function delRest(id){
  if(!confirm('تأكيد الحذف؟')) return;
  await fetch('/api/restaurants/'+id,{method:'DELETE'}); loadRestaurants();
}
async function loadOrders(){
  const r = await fetch('/api/orders'); const list = await r.json();
  document.getElementById('orders').innerHTML = list.slice(-10).reverse().map(o=>`<div class="card">${o.id} - ${JSON.stringify(o).slice(0,120)}</div>`).join('') || 'لا يوجد طلبات بعد';
}
checkHealth(); loadRestaurants(); loadOrders();
setInterval(checkHealth,5000);
</script>
</body>
</html>
